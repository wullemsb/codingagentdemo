name: Frontend CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - 'datacontract/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'datacontract/**'
      - '.github/workflows/frontend.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Lint
      run: |
        cd frontend
        npm run lint || echo "Linting not configured, skipping..."
    
    - name: Test
      run: |
        cd frontend
        npm run test -- --watch=false --browsers=ChromeHeadless || echo "Tests not configured, skipping..."
    
    - name: Build
      run: |
        cd frontend
        npm run build
    
    - name: Build Docker image
      run: |
        cd frontend
        docker build -t event-frontend:${{ github.sha }} .
        docker tag event-frontend:${{ github.sha }} event-frontend:latest
    
    - name: Save Docker image
      run: docker save event-frontend:latest -o frontend-image.tar
    
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-docker-image
        path: frontend-image.tar
        retention-days: 7
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
        retention-days: 7